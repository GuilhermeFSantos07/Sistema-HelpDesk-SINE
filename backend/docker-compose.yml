version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sine_postgres
    restart: always
    environment:
      POSTGRES_USER: sine_user
      POSTGRES_PASSWORD: sine_password
      POSTGRES_DB: sine_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  redis:
    image: redis:7-alpine
    container_name: sine_redis
    restart: always
    ports:
      - '6379:6379'

volumes:
  postgres_data: